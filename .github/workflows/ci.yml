name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ubuntu-latest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run linter
        run: |
          ruff check .

      - name: Run tests with coverage
        run: |
          pytest -q --cov=fl_data_generator

  min-deps:
    name: Minimum dependencies (Python 3.9)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install uv
        run: |
          python -m pip install --upgrade pip uv

      - name: Install minimum direct dependencies
        run: |
          uv pip install --system --resolution lowest-direct -e ".[dev]"

      - name: Verify minimum NumPy version
        run: |
          python -c "import numpy; print('Running tests with NumPy:', numpy.__version__)"

      - name: Run tests with coverage
        run: |
          pytest -q --cov=fl_data_generator

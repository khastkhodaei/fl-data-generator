[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fl-data-generator"
version = "0.1.4"
description = "A lightweight, framework-agnostic library for IID and non-IID data partitioning in Federated Learning."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Mostafa Khastkhodaei", email = "dev.khastkhodaei@gmail.com" }
]
keywords = [
    "federated-learning",
    "data-partitioning",
    "non-iid",
    "dirichlet",
    "label-skew",
    "quantity-skew",
    "machine-learning"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff~=0.17.0",
]
viz = [
    "matplotlib>=3.5.0",
]
torch = [
    "torch",
    "torchvision",
]
all = [
    "fl-data-generator[torch,viz]",
]

[project.urls]
"Homepage" = "https://github.com/khastkhodaei/fl-data-generator"
"Bug Tracker" = "https://github.com/khastkhodaei/fl-data-generator/issues"
"Source Code" = "https://github.com/khastkhodaei/fl-data-generator"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["fl_data_generator*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
]
